name: Deploy VELTRIX dashboard to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VELTRIX_API_ORIGIN: ${{ secrets.VELTRIX_API_ORIGIN }}
      VELTRIX_DASHBOARD_TOKEN: ${{ secrets.VELTRIX_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require protected default-branch deployment
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main" || {
            echo "::error::Production deployment is allowed only from main."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1;
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1;
          }
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          origin = urlsplit(os.environ["VELTRIX_API_ORIGIN"])
          assert origin.scheme == "https" and origin.hostname, "API origin must use HTTPS"
          assert origin.username is None and origin.password is None, "API origin credentials are forbidden"
          assert origin.path in ("", "/") and not origin.query and not origin.fragment, "API origin must not contain a path, query or fragment"
          _ = origin.port
          PY
          [[ "${#VELTRIX_DASHBOARD_TOKEN}" -ge 32 ]] || {
            echo "::error::VELTRIX_DASHBOARD_TOKEN must contain at least 32 characters."; exit 1;
          }
          [[ "$VELTRIX_DASHBOARD_TOKEN" != *[[:space:]]* ]] || {
            echo "::error::VELTRIX_DASHBOARD_TOKEN must not contain whitespace."; exit 1;
          }

      - name: Verify authenticated HTTPS API origin before deployment
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 12 \
            -H "Authorization: Bearer ${VELTRIX_DASHBOARD_TOKEN}" \
            "${VELTRIX_API_ORIGIN}/api/health")"
          printf '%s' "$response" | python -c '
          import json, sys
          payload = json.load(sys.stdin)
          if not isinstance(payload, dict):
              raise SystemExit("API health response must be a JSON object")
          if payload.get("ok") is not True or payload.get("database") != "connected":
              raise SystemExit("production API/database health check failed")
          if payload.get("database_read_only") is not True:
              raise SystemExit("dashboard API database binding must be read-only")
          if payload.get("live_execution") is not False:
              raise SystemExit("live execution must remain disabled")
          if payload.get("missing_paper_tables") != []:
              raise SystemExit("production paper ledger schema is incomplete")
          worker = payload.get("worker")
          if not isinstance(worker, dict) or worker.get("healthy") is not True or worker.get("stale") is True:
              raise SystemExit("persistent pipeline worker must have a fresh healthy heartbeat")
          '

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.160.0

      - name: Set Worker secrets without exposing them in logs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$VELTRIX_API_ORIGIN" | wrangler secret put VELTRIX_API_ORIGIN --config wrangler.jsonc
          printf '%s' "$VELTRIX_DASHBOARD_TOKEN" | wrangler secret put VELTRIX_DASHBOARD_TOKEN --config wrangler.jsonc

      - name: Deploy dashboard Worker and static assets
        run: wrangler deploy --config wrangler.jsonc

      - name: Confirm deployed Worker configuration
        run: wrangler deployments list --config wrangler.jsonc
