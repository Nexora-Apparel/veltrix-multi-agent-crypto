name: Read-only worker image CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.worker"
      - "compose.worker.yaml"
      - ".dockerignore"
      - ".env.worker.example"
      - "requirements*.txt"
      - "veltrix/**"
      - ".github/workflows/worker-image-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret worker environment for Compose validation
        run: cp .env.worker.example .env.worker
      - name: Validate Compose configuration
        run: docker compose -f compose.worker.yaml config --quiet
      - name: Build read-only worker image
        run: docker build --pull -f Dockerfile.worker -t veltrix-readonly-worker:ci .
      - name: Verify worker image runs as non-root
        run: |
          test "$(docker image inspect veltrix-readonly-worker:ci --format '{{.Config.User}}')" = "veltrix"
      - name: Verify expected worker entry points are present
        run: |
          docker run --rm --entrypoint python veltrix-readonly-worker:ci -c "import veltrix.solana_meme.worker, veltrix.solana_meme.intelligence_worker, veltrix.solana_meme.consensus_runtime"
