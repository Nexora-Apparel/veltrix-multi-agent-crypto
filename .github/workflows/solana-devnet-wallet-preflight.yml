name: Solana Devnet wallet balance preflight

on:
  workflow_dispatch:
    inputs:
      wallet_address:
        description: "Public Solana wallet address (never enter a private key)"
        required: true
        type: string
        default: "FQtHmufHsELvyMHvQctu1kqZQ2zY8wDCJ4KpdxTQKb9U"

permissions:
  contents: read

jobs:
  devnet-wallet-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run read-only Devnet wallet check
        env:
          WALLET_ADDRESS: ${{ inputs.wallet_address }}
        run: |
          mkdir -p artifacts
          python -m veltrix.solana_devnet_wallet_preflight --wallet "$WALLET_ADDRESS" --output artifacts/solana-devnet-wallet-preflight.json
      - name: Upload Devnet wallet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-devnet-wallet-preflight
          path: artifacts/solana-devnet-wallet-preflight.json
          if-no-files-found: warn
          retention-days: 14
