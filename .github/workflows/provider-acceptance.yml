name: Read-only provider acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate required repository secrets
        env:
          INSIGHTX_API_KEY: ${{ secrets.INSIGHTX_API_KEY }}
          GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
          SOLANA_TOKEN: ${{ secrets.VELTRIX_ACCEPTANCE_SOLANA_TOKEN }}
          BASE_TOKEN: ${{ secrets.VELTRIX_ACCEPTANCE_BASE_TOKEN }}
          BSC_TOKEN: ${{ secrets.VELTRIX_ACCEPTANCE_BSC_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required = (
              "INSIGHTX_API_KEY", "GOPLUS_ACCESS_TOKEN",
              "SOLANA_TOKEN", "BASE_TOKEN", "BSC_TOKEN",
          )
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing repository secrets: " + ", ".join(missing))
          PY
      - name: Install read-only test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live read-only provider probes
        env:
          VELTRIX_RUN_LIVE_PROVIDER_ACCEPTANCE: "true"
          INSIGHTX_API_KEY: ${{ secrets.INSIGHTX_API_KEY }}
          GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
          VELTRIX_ACCEPTANCE_SOLANA_TOKEN: ${{ secrets.VELTRIX_ACCEPTANCE_SOLANA_TOKEN }}
          VELTRIX_ACCEPTANCE_BASE_TOKEN: ${{ secrets.VELTRIX_ACCEPTANCE_BASE_TOKEN }}
          VELTRIX_ACCEPTANCE_BSC_TOKEN: ${{ secrets.VELTRIX_ACCEPTANCE_BSC_TOKEN }}
        run: pytest -q tests/test_live_provider_acceptance.py
