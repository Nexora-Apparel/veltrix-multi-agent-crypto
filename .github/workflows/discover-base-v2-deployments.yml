name: Discover Base V2 factory deployment metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-v2-deployment-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_LIQUIDITY_POOL_RPC_URL: ${{ secrets.BASE_LIQUIDITY_POOL_RPC_URL }}
      SOLIDRPC_BASE_ARCHIVE_RPC_URL: ${{ secrets.SOLIDRPC_BASE_ARCHIVE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery dependency
        run: |
          python -m pip install --upgrade pip
          pip install "eth-hash[pycryptodome]>=0.7,<1"
      - name: Validate independent archive credentials
        shell: bash
        run: |
          test -n "$BASE_LIQUIDITY_POOL_RPC_URL"
          test -n "$SOLIDRPC_BASE_ARCHIVE_RPC_URL"
          if [[ "$BASE_LIQUIDITY_POOL_RPC_URL" == "$SOLIDRPC_BASE_ARCHIVE_RPC_URL" ]]; then
            echo "::error::Archive providers must be independent."
            exit 1
          fi
      - name: Derive and cross-check factory deployment metadata
        run: python -m veltrix.base_v2_deployment_discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-v2-deployment-discovery
          path: base-v2-deployment-discovery.json
          if-no-files-found: warn
