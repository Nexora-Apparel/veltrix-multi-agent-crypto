name: Developer evidence structural acceptance

on:
  workflow_dispatch:
    inputs:
      chain:
        description: Chain to validate
        required: true
        type: choice
        options: [solana, base, bsc]
      token_address:
        description: Existing mainnet token address with complete holder history
        required: true
        type: string

permissions:
  contents: read

jobs:
  developer-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_CHAIN: ${{ inputs.chain }}
      TARGET_TOKEN: ${{ inputs.token_address }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      DEVELOPER_ROOT_ATTESTATION_URL: ${{ secrets.DEVELOPER_ROOT_ATTESTATION_URL }}
      DEVELOPER_ROOT_ATTESTATION_PUBLIC_KEY: ${{ secrets.DEVELOPER_ROOT_ATTESTATION_PUBLIC_KEY }}
      DEVELOPER_ROOT_ATTESTATION_PROVIDER_ID: ${{ secrets.DEVELOPER_ROOT_ATTESTATION_PROVIDER_ID }}
      SAFETY_EVIDENCE_MAX_AGE_MS: "900000"
      HOLDER_INVENTORY_MAX_ACCOUNTS: "50000"
      HOLDER_INVENTORY_MAX_LOGS: "200000"
      HOLDER_INVENTORY_MAX_HOLDERS: "50000"
      FUNDING_GRAPH_MAX_PAGES: "100"
      FUNDING_GRAPH_MAX_WALLETS: "2000"
      FUNDING_GRAPH_MAX_TOTAL_PAGES: "1000"
      LAUNCH_BLOCK_CHUNK_SIZE: "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required credentials
        shell: bash
        run: |
          missing=()
          for name in DEVELOPER_ROOT_ATTESTATION_URL DEVELOPER_ROOT_ATTESTATION_PUBLIC_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          case "$TARGET_CHAIN" in
            solana)
              for name in SOLANA_RPC_URL HELIUS_API_KEY; do
                [[ -n "${!name}" ]] || missing+=("$name")
              done
              ;;
            base)
              for name in BASE_RPC_URL ALCHEMY_API_KEY; do
                [[ -n "${!name}" ]] || missing+=("$name")
              done
              ;;
            bsc)
              for name in BSC_RPC_URL ETHERSCAN_API_KEY; do
                [[ -n "${!name}" ]] || missing+=("$name")
              done
              ;;
          esac
          if (( ${#missing[@]} )); then
            printf '::error::Missing required repository secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run read-only developer evidence structural acceptance
        run: |
          python -m veltrix.developer_acceptance \
            --chain "$TARGET_CHAIN" \
            --token-address "$TARGET_TOKEN" \
            --output developer-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-evidence-acceptance-${{ inputs.chain }}
          path: developer-acceptance.json
          if-no-files-found: warn
