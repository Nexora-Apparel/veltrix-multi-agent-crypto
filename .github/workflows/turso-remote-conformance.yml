name: Turso remote DB conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-turso-h0-conformance
  cancel-in-progress: false

jobs:
  remote-db-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "git+https://github.com/tursodatabase/turso.git@367fe14dff049a665d5601a8c970b9f5640bfd6d#subdirectory=serverless/python"

      - name: Require the dedicated disposable conformance database
        env:
          TURSO_CONFORMANCE_DATABASE_URL: ${{ secrets.TURSO_CONFORMANCE_DATABASE_URL }}
          TURSO_CONFORMANCE_AUTH_TOKEN: ${{ secrets.TURSO_CONFORMANCE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TURSO_CONFORMANCE_DATABASE_URL"
          test -n "$TURSO_CONFORMANCE_AUTH_TOKEN"
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["TURSO_CONFORMANCE_DATABASE_URL"])
          assert url.scheme == "libsql", "conformance URL must use libsql://"
          assert url.hostname == "veltrix-h0-conformance-test-nexora-apparel.aws-eu-central-1.turso.io", "wrong disposable database host"
          assert url.username is None and url.password is None, "URL credentials are forbidden"
          assert not url.query and not url.fragment and url.path in ("", "/"), "URL extras are forbidden"
          PY

      - name: Run live DB-API, application schema and orchestration conformance
        env:
          TURSO_CONFORMANCE_DATABASE_URL: ${{ secrets.TURSO_CONFORMANCE_DATABASE_URL }}
          TURSO_CONFORMANCE_AUTH_TOKEN: ${{ secrets.TURSO_CONFORMANCE_AUTH_TOKEN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_CONFORMANCE_AUTH_TOKEN }}
        run: |
          python -m pytest -q -rs \
            tests/test_turso_remote_conformance.py \
            tests/test_turso_application_schema.py \
            tests/test_turso_orchestration.py \
            tests/test_turso_worker_conformance.py
