name: Turso H1 adapter integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-turso-h0-conformance
  cancel-in-progress: false

jobs:
  remote-db-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed H1 adapter commit
        uses: actions/checkout@v4
        with:
          ref: 872c3bcfc4609416da56330d9be2b45d9ce7dbb2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned remote DB driver and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-turso.txt "pytest>=8,<9"

      - name: Require disposable database credentials
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"

      - name: Run H1 DB-API and application schema tests
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m pytest -q -rs tests/test_turso_remote_conformance.py tests/test_turso_application_schema.py
