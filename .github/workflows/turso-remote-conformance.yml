name: Turso remote DB conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-turso-h0-conformance
  cancel-in-progress: false

jobs:
  remote-db-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned remote DB driver and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/tursodatabase/turso.git@367fe14dff049a665d5601a8c970b9f5640bfd6d#subdirectory=serverless/python" "pytest>=8,<9"

      - name: Require dedicated disposable conformance credentials
        env:
          TURSO_CONFORMANCE_DATABASE_URL: ${{ secrets.TURSO_CONFORMANCE_DATABASE_URL }}
          TURSO_CONFORMANCE_AUTH_TOKEN: ${{ secrets.TURSO_CONFORMANCE_AUTH_TOKEN }}
        run: |
          test -n "$TURSO_CONFORMANCE_DATABASE_URL"
          test -n "$TURSO_CONFORMANCE_AUTH_TOKEN"
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ["TURSO_CONFORMANCE_DATABASE_URL"])
          assert url.scheme == "libsql", "Conformance URL must use libsql://"
          assert url.hostname == "veltrix-h0-conformance.turso.io", "Refusing non-disposable DB identity"
          assert not url.username and not url.password and not url.query and not url.fragment
          PY

      - name: Run live DB-API and application-schema conformance
        env:
          TURSO_CONFORMANCE_DATABASE_URL: ${{ secrets.TURSO_CONFORMANCE_DATABASE_URL }}
          TURSO_CONFORMANCE_AUTH_TOKEN: ${{ secrets.TURSO_CONFORMANCE_AUTH_TOKEN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_CONFORMANCE_AUTH_TOKEN }}
        run: |
          python -m pytest -q -rs \
            tests/test_turso_remote_conformance.py \
            tests/test_turso_application_schema.py
