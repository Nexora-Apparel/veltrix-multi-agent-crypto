name: Base V2 complete history and inventory acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: "JSON array with the four verified candidate deployment records"
        required: true
        type: string
      solidrpc_log_chunk_span:
        description: "SolidRPC filtered eth_getLogs chunk size (1-30000)"
        required: true
        default: "30000"
        type: string
      publicnode_log_chunk_span:
        description: "PublicNode filtered eth_getLogs chunk size (1-50000)"
        required: true
        default: "50000"
        type: string

permissions:
  contents: read

concurrency:
  group: base-v2-history-inventory-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_LIQUIDITY_POOL_RPC_URL: ${{ secrets.BASE_LIQUIDITY_POOL_RPC_URL }}
      SOLIDRPC_BASE_ARCHIVE_RPC_URL: ${{ secrets.SOLIDRPC_BASE_ARCHIVE_RPC_URL }}
      BASE_V2_CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
      BASE_V2_SOLIDRPC_LOG_CHUNK_SPAN: ${{ inputs.solidrpc_log_chunk_span }}
      BASE_V2_PUBLICNODE_LOG_CHUNK_SPAN: ${{ inputs.publicnode_log_chunk_span }}
      BASE_PUBLIC_LOGS_RPC_URL: https://base-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate independent archive credentials
        shell: bash
        run: |
          test -n "$BASE_LIQUIDITY_POOL_RPC_URL"
          test -n "$SOLIDRPC_BASE_ARCHIVE_RPC_URL"
          if [[ "$BASE_LIQUIDITY_POOL_RPC_URL" == "$SOLIDRPC_BASE_ARCHIVE_RPC_URL" ]]; then
            echo "::error::Archive providers must be independent."
            exit 1
          fi
          python - <<'PY'
          import os
          solid = int(os.environ["BASE_V2_SOLIDRPC_LOG_CHUNK_SPAN"])
          public = int(os.environ["BASE_V2_PUBLICNODE_LOG_CHUNK_SPAN"])
          if not 1 <= solid <= 30000:
              raise SystemExit("SolidRPC log chunk span must be 1-30000")
          if not 1 <= public <= 50000:
              raise SystemExit("PublicNode log chunk span must be 1-50000")
          PY
      - name: Run history and inventory unit tests
        run: pytest -q tests/test_base_v2_history_inventory.py
      - name: Reconcile complete PairCreated history and every factory pair
        run: python -m veltrix.base_v2_history_inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-v2-history-inventory-acceptance
          path: base-v2-history-inventory-acceptance.json
          if-no-files-found: warn
