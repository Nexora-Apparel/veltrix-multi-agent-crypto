name: Liquidity live read-only acceptance

on:
  push:
    paths:
      - ".github/workflows/liquidity-live-acceptance.yml"
      - "veltrix/liquidity_acceptance.py"
      - "veltrix/liquidity_evidence.py"
      - "veltrix/providers/evm_liquidity_reader.py"
      - "veltrix/providers/solana_liquidity_reader.py"
  workflow_dispatch:
    inputs:
      chain:
        description: Chain to probe
        required: true
        type: choice
        options:
          - base
          - bsc
          - solana
      token_address:
        description: Optional token address; defaults to canonical wrapped native asset
        required: false
        type: string

permissions:
  contents: read

jobs:
  base-read-only-acceptance:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.chain == 'base') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_LIQUIDITY_POOL_RPC_URL: ${{ secrets.BASE_LIQUIDITY_POOL_RPC_URL }}
      BASE_LIQUIDITY_LOCKER_RPC_URL: ${{ secrets.BASE_LIQUIDITY_LOCKER_RPC_URL }}
      BASE_LIQUIDITY_AMM_FACTORIES_JSON: ${{ secrets.BASE_LIQUIDITY_AMM_FACTORIES_JSON }}
      BASE_UNCX_LOCKERS_JSON: ${{ secrets.BASE_UNCX_LOCKERS_JSON }}
      BASE_LIQUIDITY_AMM_REGISTRY_COMPLETE: ${{ secrets.BASE_LIQUIDITY_AMM_REGISTRY_COMPLETE }}
      SAFETY_EVIDENCE_MAX_AGE_MS: "900000"
      LIQUIDITY_READER_MAX_LOGS: "200000"
      LIQUIDITY_READER_MAX_POOLS: "50000"
      LIQUIDITY_READER_MAX_LOCKS: "100000"
      TARGET_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.token_address || vars.BASE_LIQUIDITY_ACCEPTANCE_TOKEN || '0x4200000000000000000000000000000000000006' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Base read-only credentials
        id: config
        shell: bash
        run: |
          if [[ -z "$BASE_LIQUIDITY_POOL_RPC_URL" || -z "$BASE_LIQUIDITY_LOCKER_RPC_URL" || -z "$BASE_LIQUIDITY_AMM_FACTORIES_JSON" || -z "$BASE_UNCX_LOCKERS_JSON" || "$BASE_LIQUIDITY_AMM_REGISTRY_COMPLETE" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base live acceptance skipped: independent RPC endpoints, pinned registries and complete-scope attestation are not all configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute Base finalized-state acceptance
        if: steps.config.outputs.ready == 'true'
        run: python -m veltrix.liquidity_acceptance --chain base --token-address "$TARGET_TOKEN"

  bsc-read-only-acceptance:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.chain == 'bsc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BSC_LIQUIDITY_POOL_RPC_URL: ${{ secrets.BSC_LIQUIDITY_POOL_RPC_URL }}
      BSC_LIQUIDITY_LOCKER_RPC_URL: ${{ secrets.BSC_LIQUIDITY_LOCKER_RPC_URL }}
      BSC_LIQUIDITY_AMM_FACTORIES_JSON: ${{ secrets.BSC_LIQUIDITY_AMM_FACTORIES_JSON }}
      BSC_UNCX_LOCKERS_JSON: ${{ secrets.BSC_UNCX_LOCKERS_JSON }}
      BSC_LIQUIDITY_AMM_REGISTRY_COMPLETE: ${{ secrets.BSC_LIQUIDITY_AMM_REGISTRY_COMPLETE }}
      SAFETY_EVIDENCE_MAX_AGE_MS: "900000"
      LIQUIDITY_READER_MAX_LOGS: "200000"
      LIQUIDITY_READER_MAX_POOLS: "50000"
      LIQUIDITY_READER_MAX_LOCKS: "100000"
      TARGET_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.token_address || vars.BSC_LIQUIDITY_ACCEPTANCE_TOKEN || '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check BSC read-only credentials
        id: config
        shell: bash
        run: |
          if [[ -z "$BSC_LIQUIDITY_POOL_RPC_URL" || -z "$BSC_LIQUIDITY_LOCKER_RPC_URL" || -z "$BSC_LIQUIDITY_AMM_FACTORIES_JSON" || -z "$BSC_UNCX_LOCKERS_JSON" || "$BSC_LIQUIDITY_AMM_REGISTRY_COMPLETE" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BSC live acceptance skipped: independent RPC endpoints, pinned registries and complete-scope attestation are not all configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute BSC finalized-state acceptance
        if: steps.config.outputs.ready == 'true'
        run: python -m veltrix.liquidity_acceptance --chain bsc --token-address "$TARGET_TOKEN"

  solana-read-only-acceptance:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.chain == 'solana') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_LIQUIDITY_POOL_RPC_URL: ${{ secrets.SOLANA_LIQUIDITY_POOL_RPC_URL }}
      SOLANA_LIQUIDITY_LOCKER_RPC_URL: ${{ secrets.SOLANA_LIQUIDITY_LOCKER_RPC_URL }}
      SOLANA_RAYDIUM_AMM_V4_EXECUTABLE_HASH: ${{ secrets.SOLANA_RAYDIUM_AMM_V4_EXECUTABLE_HASH }}
      SOLANA_RAYDIUM_CPMM_EXECUTABLE_HASH: ${{ secrets.SOLANA_RAYDIUM_CPMM_EXECUTABLE_HASH }}
      SOLANA_LIQUIDITY_AMM_REGISTRY_COMPLETE: ${{ secrets.SOLANA_LIQUIDITY_AMM_REGISTRY_COMPLETE }}
      SAFETY_EVIDENCE_MAX_AGE_MS: "900000"
      LIQUIDITY_READER_MAX_POOLS: "20000"
      LIQUIDITY_READER_MAX_LOCKS: "20000"
      TARGET_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.token_address || vars.SOLANA_LIQUIDITY_ACCEPTANCE_TOKEN || 'So11111111111111111111111111111111111111112' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Solana read-only credentials
        id: config
        shell: bash
        run: |
          if [[ -z "$SOLANA_LIQUIDITY_POOL_RPC_URL" || -z "$SOLANA_LIQUIDITY_LOCKER_RPC_URL" || -z "$SOLANA_RAYDIUM_AMM_V4_EXECUTABLE_HASH" || -z "$SOLANA_RAYDIUM_CPMM_EXECUTABLE_HASH" || "$SOLANA_LIQUIDITY_AMM_REGISTRY_COMPLETE" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Solana live acceptance skipped: independent RPC endpoints, both pinned Raydium program hashes and complete-scope attestation are not all configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute Solana finalized-slot acceptance
        if: steps.config.outputs.ready == 'true'
        run: python -m veltrix.liquidity_acceptance --chain solana --token-address "$TARGET_TOKEN"
