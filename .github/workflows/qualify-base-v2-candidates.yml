name: Qualify provisional Base V2 factories

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: 'JSON array with amm_id, address, creation_tx and deployment_block for all four candidates'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: base-v2-candidate-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_LIQUIDITY_POOL_RPC_URL: ${{ secrets.BASE_LIQUIDITY_POOL_RPC_URL }}
      SOLIDRPC_BASE_ARCHIVE_RPC_URL: ${{ secrets.SOLIDRPC_BASE_ARCHIVE_RPC_URL }}
      BASE_V2_CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "eth-hash[pycryptodome]>=0.7,<1"
      - name: Validate archive credentials
        shell: bash
        run: |
          test -n "$BASE_LIQUIDITY_POOL_RPC_URL"
          test -n "$SOLIDRPC_BASE_ARCHIVE_RPC_URL"
          if [[ "$BASE_LIQUIDITY_POOL_RPC_URL" == "$SOLIDRPC_BASE_ARCHIVE_RPC_URL" ]]; then
            echo "::error::Archive providers must be independent."
            exit 1
          fi
      - name: Run dual-provider factory and pair-interface qualification
        run: python -m veltrix.base_v2_candidate_qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-v2-candidate-qualification
          path: base-v2-candidate-qualification.json
          if-no-files-found: warn
