name: Hosting integration mergeability probe
on:
  push:
    branches:
      - work/hosting-rebase-probe-20261115
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build a two-parent reconciliation commit from current main and PR 22
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main work/h1.1-h2-h3-clean
          set +e
          merge_output="$(git merge-tree --write-tree origin/main origin/work/h1.1-h2-h3-clean 2>&1)"
          merge_status=$?
          set -e
          printf '%s\n' "$merge_output"
          tree_sha="$(printf '%s\n' "$merge_output" | head -n 1)"
          if ! [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "merge-tree did not return a valid tree SHA" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merge_commit="$(printf '%s\n' "Reconcile H1.1/H2/H3 with current main (merge status $merge_status)" | git commit-tree "$tree_sha" -p origin/main -p origin/work/h1.1-h2-h3-clean)"
          echo "Reconciliation commit: $merge_commit"
          git push origin "$merge_commit:refs/heads/work/hosting-integration-reconcile-20261115"
