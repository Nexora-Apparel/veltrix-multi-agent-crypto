name: Hosting integration mergeability probe
on:
  push:
    branches:
      - work/hosting-rebase-probe-20261115
permissions:
  contents: read
jobs:
  merge-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare current main with PR 22 integration branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main work/h1.1-h2-h3-clean
          set +e
          git merge-tree --write-tree origin/main origin/work/h1.1-h2-h3-clean > hosting-merge-tree.txt 2>&1
          result=$?
          set -e
          cat hosting-merge-tree.txt
          if [ "$result" -eq 0 ]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflicts" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload merge analysis
        uses: actions/upload-artifact@v4
        with:
          name: hosting-merge-analysis
          path: hosting-merge-tree.txt
          if-no-files-found: error
