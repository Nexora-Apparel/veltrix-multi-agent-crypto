name: Initialize production Turso schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-production-turso-schema-init
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VELTRIX_DEPLOYMENT_TARGET: ci
      TELEGRAM_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      LIVE_TRADING: "false"
      PAPER_TRADING_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and Turso adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-turso.txt
      - name: Initialize and verify production schema
        run: python scripts/initialize_turso_database.py
