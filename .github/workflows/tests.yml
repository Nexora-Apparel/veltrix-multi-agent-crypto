name: Python CI
on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q veltrix tests
      - run: bash -n deployment/verify_phase09_isolation.sh deployment/phase09_host_preflight.sh
      - run: pytest -q
      # Live probes are read-only and use public provider endpoints by default.
      # Run only on trusted pushes to Phase 09 branches; never expose secrets to PR code.
      - name: Live Solana discovery provider smoke
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/phase-9.')
        run: python -m veltrix.solana_meme.smoke
      - name: Live Solana market-data smoke
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/phase-9.')
        run: python -m veltrix.solana_meme.market_smoke
      - name: Live Solana finalized mint-account smoke
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/phase-9.')
        run: python -m veltrix.solana_meme.risk_smoke
