name: Python CI
on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q veltrix tests scripts
      - run: pytest -q
      - name: Live Solana discovery provider smoke
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/phase-3-solana-discovery')
        env:
          VELTRIX_PUMPPORTAL_WS_ENDPOINT: ${{ secrets.VELTRIX_PUMPPORTAL_WS_ENDPOINT }}
        run: python -m veltrix.solana_meme.smoke
      - name: Live Solana market-data smoke
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/phase-4-token-intelligence')
        run: python -m veltrix.solana_meme.market_smoke
      - name: Live Solana finalized mint-account smoke
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/phase-5-security-risk')
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -m veltrix.solana_meme.risk_smoke


  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret worker environment for Compose validation
        run: cp .env.worker.example .env.worker
      - name: Validate Compose configuration
        run: docker compose -f compose.worker.yaml config --quiet
      - name: Build read-only worker image
        run: docker build --pull -f Dockerfile.worker -t veltrix-readonly-worker:ci .
      - name: Verify worker image runs as non-root
        run: test "$(docker image inspect veltrix-readonly-worker:ci --format '{{.Config.User}}')" = "veltrix"
      - name: Verify worker entry points are importable
        run: docker run --rm --entrypoint python veltrix-readonly-worker:ci -c "import veltrix.solana_meme.worker, veltrix.solana_meme.intelligence_worker, veltrix.solana_meme.consensus_runtime"
