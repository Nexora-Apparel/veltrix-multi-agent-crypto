name: Python CI
on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q veltrix tests
      - run: pytest -q
      - name: Live Solana discovery provider smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'work/phase-3-solana-discovery'
        env:
          VELTRIX_PUMPPORTAL_WS_ENDPOINT: ${{ secrets.VELTRIX_PUMPPORTAL_WS_ENDPOINT }}
        run: python -m veltrix.solana_meme.smoke
      - name: Live Solana market-data smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'work/phase-4-token-intelligence'
        run: python -m veltrix.solana_meme.market_smoke
      - name: Live Solana finalized mint-account smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'work/phase-5-security-risk'
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -m veltrix.solana_meme.risk_smoke

      - name: Live Raydium Devnet quote, pool verification and unsigned simulation
        if: github.event_name == 'pull_request' && github.head_ref == 'work/devnet-raydium-swap-preflight'
        run: |
          mkdir -p artifacts
          python -m veltrix.solana_devnet_swap_preflight \
            --wallet "FQtHmufHsELvyMHvQctu1kqZQ2zY8wDCJ4KpdxTQKb9U" \
            --amount-lamports "10000000" \
            --output artifacts/raydium-devnet-swap-preflight.json
      - name: Upload Raydium Devnet preflight evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'work/devnet-raydium-swap-preflight'
        uses: actions/upload-artifact@v4
        with:
          name: raydium-devnet-swap-preflight
          path: artifacts/raydium-devnet-swap-preflight.json
          if-no-files-found: warn
          retention-days: 14
