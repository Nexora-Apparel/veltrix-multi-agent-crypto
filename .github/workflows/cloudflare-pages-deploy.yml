name: Deploy VELTRIX Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "veltrix/dashboard_assets/**"
      - "package.json"
      - "wrangler.toml"
      - "scripts/build-pages.mjs"
      - ".github/workflows/cloudflare-pages-deploy.yml"

permissions:
  contents: read

concurrency:
  group: veltrix-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_READONLY_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_AUTH_TOKEN }}
      DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
      PROJECT_NAME: veltrix-multi-agent-crypto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_READONLY_AUTH_TOKEN DASHBOARD_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          test "${#DASHBOARD_API_TOKEN}" -ge 32
      - name: Install and build Pages bundle
        run: |
          npm install --ignore-scripts
          npm run build:pages
      - name: Verify the production dashboard token is read-only
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_READONLY_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_AUTH_TOKEN }}
        run: node scripts/verify-turso-readonly-token.mjs
      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          list_response_file="$(mktemp)"
          list_http_status="$(curl --silent --show-error --output "$list_response_file" --write-out "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          if [ "$list_http_status" -lt 200 ] || [ "$list_http_status" -ge 300 ]; then
            echo "Cloudflare Pages project listing failed (HTTP $list_http_status)." >&2
            jq -c '{success, errors, messages}' "$list_response_file" >&2 || cat "$list_response_file" >&2
            rm -f "$list_response_file"
            exit 1
          fi
          if ! jq -e '.success == true and (.result | type == "array")' "$list_response_file" >/dev/null; then
            echo "Cloudflare Pages project listing returned an unexpected response." >&2
            jq -c '{success, errors, messages}' "$list_response_file" >&2 || cat "$list_response_file" >&2
            rm -f "$list_response_file"
            exit 1
          fi
          if ! jq -e --arg name "$PROJECT_NAME" '.result[]? | select(.name == $name)' "$list_response_file" >/dev/null; then
            rm -f "$list_response_file"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT_NAME\",\"production_branch\":\"main\"}")"
            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "Cloudflare Pages project creation failed (HTTP $http_status)." >&2
              jq -c '{success, errors, messages}' "$response_file" >&2 || cat "$response_file" >&2
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
          fi
      - name: Bind production-only dashboard secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TURSO_DATABASE_URL" | npx wrangler pages secret put TURSO_DATABASE_URL --project-name "$PROJECT_NAME" --env production
          printf '%s' "$TURSO_READONLY_AUTH_TOKEN" | npx wrangler pages secret put TURSO_AUTH_TOKEN --project-name "$PROJECT_NAME" --env production
          printf '%s' "$DASHBOARD_API_TOKEN" | npx wrangler pages secret put DASHBOARD_API_TOKEN --project-name "$PROJECT_NAME" --env production
      - name: Deploy Pages assets and Functions
        run: npx wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify deployed dashboard and read-only API
        shell: bash
        run: |
          set -euo pipefail
          project="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          subdomain="$(printf '%s' "$project" | jq -r '.result.subdomain')"
          test -n "$subdomain"
          base="https://$subdomain"
          curl --fail --silent --show-error "$base/" | grep -q "VELTRIX"
          unauthenticated_status="$(curl --silent --output /tmp/veltrix-unauthorized.json --write-out "%{http_code}" "$base/api/health")"
          test "$unauthenticated_status" = "401"
          jq -e '.error == "unauthorized"' /tmp/veltrix-unauthorized.json >/dev/null
          status="$(curl --silent --output /tmp/veltrix-health.json --write-out "%{http_code}" \
            -H "Authorization: Bearer $DASHBOARD_API_TOKEN" "$base/api/health")"
          test "$status" = "200"
          jq -e '.ok == true and .database == "connected" and .database_read_only == true and .paper_ledger_initialized == true and .live_execution == false and (.missing_paper_tables | length == 0)' /tmp/veltrix-health.json >/dev/null
          echo "Production Pages deployment, public auth boundary and authenticated read-only Turso API verified at $base"
