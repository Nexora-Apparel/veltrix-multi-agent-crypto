name: Deploy VELTRIX Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "veltrix/dashboard_assets/**"
      - "package.json"
      - "wrangler.toml"
      - "scripts/build-pages.mjs"
      - ".github/workflows/cloudflare-pages-deploy.yml"

permissions:
  contents: read

concurrency:
  group: veltrix-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_READONLY_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_AUTH_TOKEN }}
      DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
      PROJECT_NAME: veltrix-multi-agent-crypto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_READONLY_AUTH_TOKEN DASHBOARD_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          test "${#DASHBOARD_API_TOKEN}" -ge 32
      - name: Install and build Pages bundle
        run: |
          npm install --ignore-scripts
          npm run build:pages
      - name: Verify the production dashboard token is read-only
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_READONLY_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_AUTH_TOKEN }}
        run: node scripts/verify-turso-readonly-token.mjs
      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          list_response_file="$(mktemp)"
          list_http_status="$(curl --silent --show-error --output "$list_response_file" --write-out "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          if [ "$list_http_status" -lt 200 ] || [ "$list_http_status" -ge 300 ]; then
            echo "Cloudflare Pages project listing failed (HTTP $list_http_status)." >&2
            jq -c '{success, errors, messages}' "$list_response_file" >&2 || cat "$list_response_file" >&2
            rm -f "$list_response_file"
            exit 1
          fi
          if ! jq -e '.success == true and (.result | type == "array")' "$list_response_file" >/dev/null; then
            echo "Cloudflare Pages project listing returned an unexpected response." >&2
            jq -c '{success, errors, messages}' "$list_response_file" >&2 || cat "$list_response_file" >&2
            rm -f "$list_response_file"
            exit 1
          fi
          if ! jq -e --arg name "$PROJECT_NAME" '.result[]? | select(.name == $name)' "$list_response_file" >/dev/null; then
            rm -f "$list_response_file"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT_NAME\",\"production_branch\":\"main\"}")"
            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "Cloudflare Pages project creation failed (HTTP $http_status)." >&2
              jq -c '{success, errors, messages}' "$response_file" >&2 || cat "$response_file" >&2
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
          fi
      - name: Bind production-only dashboard secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TURSO_DATABASE_URL" | npx wrangler pages secret put TURSO_DATABASE_URL --project-name "$PROJECT_NAME" --env production
          printf '%s' "$TURSO_READONLY_AUTH_TOKEN" | npx wrangler pages secret put TURSO_AUTH_TOKEN --project-name "$PROJECT_NAME" --env production
          printf '%s' "$DASHBOARD_API_TOKEN" | npx wrangler pages secret put DASHBOARD_API_TOKEN --project-name "$PROJECT_NAME" --env production
      - name: Deploy Pages assets and Functions
        run: npx wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify deployed dashboard and read-only API
        shell: bash
        run: |
          set -euo pipefail
          project="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          subdomain="$(printf '%s' "$project" | jq -r '.result.subdomain')"
          test -n "$subdomain"
          base="https://$subdomain"

          # Cloudflare Pages can take a short interval to propagate a new
          # deployment to the stable project hostname. Capture status/body
          # separately so a transient or persistent 5xx is diagnosable.
          homepage_status="000"
          for attempt in $(seq 1 12); do
            homepage_status="$(curl --silent --show-error --output /tmp/veltrix-homepage.html --write-out "%{http_code}" "$base/" || true)"
            if [ "$homepage_status" = "200" ] && grep -q "VELTRIX" /tmp/veltrix-homepage.html; then
              break
            fi
            echo "Pages homepage verification attempt $attempt: HTTP $homepage_status"
            sleep 5
          done
          if [ "$homepage_status" != "200" ] || ! grep -q "VELTRIX" /tmp/veltrix-homepage.html; then
            echo "Pages homepage did not become healthy at $base/." >&2
            head -c 500 /tmp/veltrix-homepage.html >&2 || true
            exit 1
          fi

          unauthenticated_status="000"
          for attempt in $(seq 1 6); do
            unauthenticated_status="$(curl --silent --show-error --output /tmp/veltrix-unauthorized.json --write-out "%{http_code}" "$base/api/health" || true)"
            if [ "$unauthenticated_status" = "401" ]; then break; fi
            echo "Unauthenticated API verification attempt $attempt: HTTP $unauthenticated_status"
            sleep 5
          done
          if [ "$unauthenticated_status" != "401" ]; then
            echo "Expected unauthenticated API status 401; got $unauthenticated_status" >&2
            cat /tmp/veltrix-unauthorized.json >&2 || true
            exit 1
          fi
          jq -e '.error == "unauthorized"' /tmp/veltrix-unauthorized.json >/dev/null

          invalid_status="$(curl --silent --show-error --output /tmp/veltrix-invalid-token.json --write-out "%{http_code}" \
            -H "Authorization: Bearer veltrix-invalid-acceptance-token" "$base/api/health" || true)"
          if [ "$invalid_status" != "401" ]; then
            echo "Expected invalid/revoked bearer token status 401; got $invalid_status" >&2
            cat /tmp/veltrix-invalid-token.json >&2 || true
            exit 1
          fi
          jq -e '.error == "unauthorized"' /tmp/veltrix-invalid-token.json >/dev/null

          status="000"
          for attempt in $(seq 1 6); do
            status="$(curl --silent --show-error --output /tmp/veltrix-health.json --write-out "%{http_code}" \
              -H "Authorization: Bearer $DASHBOARD_API_TOKEN" "$base/api/health" || true)"
            if [ "$status" = "200" ]; then break; fi
            echo "Authenticated read-only API verification attempt $attempt: HTTP $status"
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "Authenticated API health failed at $base/api/health (HTTP $status)." >&2
            cat /tmp/veltrix-health.json >&2 || true
            exit 1
          fi
          jq -e '.ok == true and .database == "connected" and .database_read_only == true and .paper_ledger_initialized == true and .live_execution == false and (.missing_paper_tables | length == 0)' /tmp/veltrix-health.json >/dev/null

          runtime_status="$(curl --silent --show-error --output /tmp/veltrix-runtime-status.json --write-out "%{http_code}" \
            -H "Authorization: Bearer $DASHBOARD_API_TOKEN" "$base/api/runtime-status" || true)"
          if [ "$runtime_status" != "200" ]; then
            echo "Production runtime diagnostics returned HTTP $runtime_status." >&2
            cat /tmp/veltrix-runtime-status.json >&2 || true
            exit 1
          fi
          jq -e '.read_only == true and .live_execution == false' /tmp/veltrix-runtime-status.json >/dev/null
          echo "Production runtime telemetry: agents=$(jq -r '.agents.status' /tmp/veltrix-runtime-status.json), providers=$(jq -r '.providers.status' /tmp/veltrix-runtime-status.json)"

          for chain in base bsc; do
            chain_status="$(curl --silent --show-error --output "/tmp/veltrix-$chain-markets.json" --write-out "%{http_code}" \
              -H "Authorization: Bearer $DASHBOARD_API_TOKEN" "$base/api/chain-markets?chain=$chain" || true)"
            if [ "$chain_status" != "200" ]; then
              echo "Production $chain market API returned HTTP $chain_status." >&2
              cat "/tmp/veltrix-$chain-markets.json" >&2 || true
              exit 1
            fi
            jq -e --arg chain "$chain" '.chain == $chain and .available == true' "/tmp/veltrix-$chain-markets.json" >/dev/null
            count="$(jq -r '.observation_count' "/tmp/veltrix-$chain-markets.json")"
            latest="$(jq -r '.latest_observed_at // "none"' "/tmp/veltrix-$chain-markets.json")"
            echo "Production $chain market observations: $count; latest: $latest"
          done
          echo "Production Pages deployment, bearer-token rejection, read-only Turso API, runtime diagnostics and Base/BSC data contracts verified at $base"
