name: Cloudflare dashboard configuration validation

on:
  push:
    branches: [work/veltrix-trading-terminal]
    paths:
      - "cloudflare/**"
      - "veltrix/dashboard_assets/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-dashboard-validation.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "veltrix/dashboard_assets/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-dashboard-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Worker proxy security and route allowlist
        run: node --test tests/cloudflare_worker.test.mjs
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.160.0
      - name: Bundle Worker and static dashboard without deploying
        run: wrangler deploy --dry-run --config wrangler.jsonc
