name: VELTRIX scheduled Solana pipeline

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-fenced-scheduled-pipeline
  cancel-in-progress: false

jobs:
  bounded-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VELTRIX_SOLANA_DISCOVERY_DB: ${{ secrets.VELTRIX_SOLANA_DISCOVERY_DB }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VELTRIX_PIPELINE_POLL_SECONDS: "300"
      VELTRIX_CANDLE_INTERVAL: "1m"
      LIVE_TRADING: "false"
      PAPER_TRADING_ENABLED: "false"
      SOL_PAPER_TRADING_ENABLED: ${{ vars.SOL_PAPER_TRADING_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Execute exactly the revision that triggered this workflow. Once
          # merged, scheduled runs use the protected default-branch revision;
          # manual runs use the selected workflow_dispatch revision.
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify persistent database configuration
        run: |
          test -n "$VELTRIX_SOLANA_DISCOVERY_DB" || {
            echo "::error::Set repository secret VELTRIX_SOLANA_DISCOVERY_DB to the production Turso libsql:// URL."
            exit 1
          }
          test -n "$TURSO_AUTH_TOKEN" || {
            echo "::error::Set repository secret TURSO_AUTH_TOKEN to the production Turso auth token."
            exit 1
          }
          case "$VELTRIX_SOLANA_DISCOVERY_DB" in
            libsql://*) ;;
            *) echo "::error::Scheduled runner requires the shared Turso libsql:// database."; exit 1 ;;
          esac
      - name: Run one fenced pipeline cycle
        run: python -m veltrix.solana_meme.pipeline_once
