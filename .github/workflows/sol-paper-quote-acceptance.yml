name: Native SOL quote-to-paper-ledger acceptance

on:
  push:
    branches: [work/veltrix-trading-terminal]
    paths:
      - ".github/workflows/sol-paper-quote-acceptance.yml"
      - "tests/test_live_sol_paper_quote.py"
      - "veltrix/solana_meme/sol_paper_quote.py"
      - "veltrix/solana_meme/market_data.py"
      - "veltrix/solana_meme/market_store.py"
      - "veltrix/solana_meme/sol_paper_wallet.py"
      - "veltrix/providers/dexscreener.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-quote-simulated-sol-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/veltrix-trading-terminal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate live SOL/USD conversion and simulated SOL ledger recovery
        env:
          VELTRIX_LIVE_SOL_QUOTE_TEST: "1"
        run: pytest -q -s tests/test_live_sol_paper_quote.py
